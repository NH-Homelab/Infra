name: Deploy Platform Infrastructure

on:
  push:
    branches: [ main ]
    paths:
      - 'charts/platform/Chart.yaml'
      - 'charts/platform/values.yaml'
      - 'charts/platform/db/**'
      - 'charts/platform/templates/**'
      - '.github/workflows/ci.yaml'
  workflow_dispatch:
jobs:
  deploy-platform:
    runs-on: k8s-prod-k3s
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Set up Helm
        uses: azure/setup-helm@v3
      - name: Set Kubeconfig
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Add Helm Repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add runix https://helm.runix.net
          helm repo add cloudflare https://cloudflare.github.io/helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
      - name: Build Chart Dependencies
        run: helm dependency build charts/platform
      - name: Deploy Platform Layer
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          DB_PASS: ${{ secrets.POSTGRES_PASSWORD }}
          MINIO_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_PASS: ${{ secrets.MINIO_ROOT_PASSWORD }}
          PGADMIN_EMAIL: ${{ secrets.PGADMIN_EMAIL }}
          PGADMIN_PASS: ${{ secrets.PGADMIN_PASSWORD }}
          GRAFANA_PASS: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          helm upgrade --install production-infra charts/platform \
            --namespace homelab \
            --create-namespace \
            --set tunnel.cloudflare.tunnel_token="$TUNNEL_TOKEN" \
            --set db.auth.postgresPassword="$DB_PASS" \
            --set minio.auth.rootUser="$MINIO_USER" \
            --set minio.auth.rootPassword="$MINIO_PASS" \
            --set pgadmin4.env.email="$PGADMIN_EMAIL" \
            --set pgadmin4.env.password="$PGADMIN_PASS" \
            --set prometheus.grafana.adminPassword="$GRAFANA_PASS"