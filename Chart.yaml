apiVersion: v2
name: platform-infrastructure
description: Base infrastructure (pgadmin, postgres, minio, cloudflared tunnel)
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: postgresql
    version: ^12.0.0
    repository: https://charts.bitnami.com/bitnami
    alias: db
  - name: minio
    version: ^12.0.0
    repository: https://charts.bitnami.com/bitnami
    alias: minio
  - name: pgadmin4
    version: ^1.0.0
    repository: https://helm.runix.net
  - name: cloudflare-tunnel-remote
    version: ^0.1.0
    repository: https://cloudflare.github.io/helm-charts
    alias: tunnel
  - name: kube-prometheus-stack
    version: ^81.0.0
    repository: https://prometheus-community.github.io/helm-charts
    alias: prometheus